  }

let currentFloor = 1;
let selectedId = null;

function currentBlocks(){ return state[currentZone][currentFloor]; }

function defaultSize(category, name, override){
  if(override) return override;
  if(category === "fixed") return {w:1,h:1};
  return {w:2,h:2};
}

/* 겹치지 않는 빈 자리 탐색 */
function overlaps(col,row,w,h,list,ignoreId){
  for(const b of list){
    if(b.id === ignoreId) continue;
    if(col < b.col + b.w && col + w > b.col && row < b.row + b.h && row + h > b.row) return true;
  }
  return false;
}
function findFreeSpot(w,h,list){
  for(let row=0; row<300; row++){
    for(let col=0; col<=COLS-w; col++){
      if(!overlaps(col,row,w,h,list)) return {col,row};
    }
  }
  return {col:0,row:0};
}

/* 실제 배치 데이터를 자동으로 그리드에 흘려 배치 */
function autoLayout(items){
  let col=0, row=0, rowH=0;
  const out = [];
  items.forEach(it=>{
    const size = it.size || defaultSize(it.category, it.name);
    if(col + size.w > COLS){ col = 0; row += rowH; rowH = 0; }
    out.push(Object.assign({
      id: newId(), col, row, w:size.w, h:size.h,
      fixed: !!it.fixed,
    }, { name: it.name, num: it.num || "", category: it.category }));
    col += size.w;
    rowH = Math.max(rowH, size.h);
  });
  return out;
}

/* =========================================================
   4. 렌더링 - 탭
========================================================= */
const zoneTabsEl = document.getElementById("zoneTabs");
const floorTabsEl = document.getElementById("floorTabs");

function renderZoneTabs(){
  zoneTabsEl.innerHTML = "";
  Object.keys(ZONE_META).forEach(z=>{
    const btn = document.createElement("button");
    btn.className = "tabBtn px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-500" + (z===currentZone?" active":"");
    btn.textContent = ZONE_META[z].name;
    btn.onclick = ()=>{
      currentZone = z;
      if(!ZONE_META[z].floors.includes(currentFloor)) currentFloor = ZONE_META[z].floors[0];
      selectedId = null;
      renderAll();
    };
    zoneTabsEl.appendChild(btn);
  });
}

function renderFloorTabs(){
  floorTabsEl.innerHTML = "";
  ZONE_META[currentZone].floors.forEach(f=>{
    const btn = document.createElement("button");
    btn.className = "tabBtn px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-500" + (f===currentFloor?" active":"");
    btn.textContent = f + "층";
    btn.onclick = ()=>{ currentFloor = f; selectedId = null; renderAll(); };
    floorTabsEl.appendChild(btn);
  });
}

/* =========================================================
   5. 렌더링 - 좌측 팔레트
========================================================= */
const paletteRoot = document.getElementById("paletteRoot");
function renderPalette(){
  paletteRoot.innerHTML = "";
  PALETTE.forEach(group=>{
    const meta = CATEGORY_META[group.key];
    const wrap = document.createElement("div");
    const title = document.createElement("p");
    title.className = "text-[11.5px] font-extrabold text-slate-500 px-1 mb-1.5 flex items-center gap-1.5";
    title.innerHTML = `<span class="swatch" style="background:${meta.color};border-color:${meta.border}"></span>${meta.label}`;
    wrap.appendChild(title);

    const list = document.createElement("div");
    list.className = "space-y-1";
    group.items.forEach(item=>{
      const b = document.createElement("button");
      b.className = "sidebarBtn";
      b.style.background = meta.color + "55";
      b.style.borderColor = meta.border + "66";
      b.draggable = true;
      b.innerHTML = `<span class="swatch" style="background:${meta.color};border-color:${meta.border}"></span>${item.name}`;
      b.addEventListener("click", ()=> addBlockFromPalette(group.key, item));
      b.addEventListener("dragstart", ev=>{
        ev.dataTransfer.setData("text/plain", JSON.stringify({cat:group.key, item}));
      });
      list.appendChild(b);
    });
    wrap.appendChild(list);
    paletteRoot.appendChild(wrap);

    if(group.key === "common"){
      const customWrap = document.createElement("div");
      customWrap.className = "flex gap-1 mt-1.5";
      customWrap.innerHTML = `
        <input id="customName" type="text" placeholder="신규 공간 이름" class="flex-1 min-w-0 text-[11.5px] border border-slate-200 rounded-lg px-2 py-1.5">
        <button id="customAddBtn" class="text-[11.5px] font-bold bg-teal-500 text-white px-2.5 rounded-lg hover:bg-teal-600">추가</button>`;
      wrap.appendChild(customWrap);
    }
  });

  document.getElementById("customAddBtn").onclick = ()=>{
    const input = document.getElementById("customName");
    const v = input.value.trim();
    if(!v) return;
    addBlockFromPalette("common", {name:v});
    input.value = "";
  };
}

function addBlockFromPalette(category, item){
  const list = currentBlocks();
  const size = item.size || defaultSize(category, item.name);
  const spot = findFreeSpot(size.w, size.h, list);
  list.push({
    id: newId(), name:item.name, num:"", category,
    col:spot.col, row:spot.row, w:size.w, h:size.h,
    fixed: !!item.fixed,
  });
  selectedId = null;
  renderAll();
}

/* =========================================================
   6. 렌더링 - 캔버스 (블록 드래그 / 리사이즈 / 선택)
========================================================= */
const canvasEl = document.getElementById("canvas");
const canvasWrapEl = document.getElementById("canvasWrap");
const canvasTitleEl = document.getElementById("canvasTitle");

function gridBounds(list){
  let maxCol = COLS, maxRow = 8;
  list.forEach(b=>{
    maxCol = Math.max(maxCol, b.col + b.w + 1);
    maxRow = Math.max(maxRow, b.row + b.h + 1);
  });
  return {maxCol, maxRow};
}

function renderCanvas(){
  canvasTitleEl.textContent = `${ZONE_META[currentZone].name} · ${currentFloor}층 배치도`;
  const list = currentBlocks();
  const {maxCol, maxRow} = gridBounds(list);
  canvasEl.style.width = (maxCol*CELL) + "px";
  canvasEl.style.height = (maxRow*CELL) + "px";
  canvasEl.innerHTML = "";

  list.forEach(b=>{
    const meta = CATEGORY_META[b.category];
    const div = document.createElement("div");
    div.className = "block" + (b.id===selectedId?" selected":"") + (b.fixed?" fixedBlock":"");
    div.style.left = (b.col*CELL) + "px";
    div.style.top = (b.row*CELL) + "px";
    div.style.width = (b.w*CELL - 5) + "px";
    div.style.height = (b.h*CELL - 5) + "px";
    div.style.background = meta.color;
    div.style.borderColor = meta.border;
    div.dataset.id = b.id;

    div.innerHTML = `
      ${b.fixed?'<span class="badge">고정</span>':''}
      <div class="name">${b.name}</div>
      ${b.num?`<div class="num">#${b.num}</div>`:""}
    `;
    if(!b.fixed){
      const handle = document.createElement("div");
      handle.className = "resizeHandle";
      handle.addEventListener("mousedown", ev=> startResize(ev, b));
      div.appendChild(handle);
    }
    div.addEventListener("mousedown", ev=> startDrag(ev, b));
    canvasEl.appendChild(div);
  });

  renderList(list);
  renderEditPanel();
  renderGlobalStat();
  renderBuildingOverview();
}

/* =========================================================
   6-1. 건물 전체 배치도 (현재 동의 전 층 실시간 미리보기)
========================================================= */
const overviewEl = document.getElementById("buildingOverview");
const overviewZoneNameEl = document.getElementById("overviewZoneName");
const MINI_CELL = 7;

function renderBuildingOverview(){
  overviewZoneNameEl.textContent = "· " + ZONE_META[currentZone].name;
  overviewEl.innerHTML = "";
  ZONE_META[currentZone].floors.slice().reverse().forEach(f=>{
    const list = state[currentZone][f];
    const {maxCol, maxRow} = gridBounds(list);
    const w = maxCol * MINI_CELL, h = maxRow * MINI_CELL;
    const isActive = f === currentFloor;

    const card = document.createElement("div");
    card.className = "rounded-xl border-2 p-2 cursor-pointer transition hover:shadow-md " +
      (isActive ? "border-slate-900 bg-slate-50" : "border-slate-200 bg-white");

    const header = document.createElement("div");
    header.className = "text-[11px] font-extrabold text-slate-600 mb-1.5 flex items-center justify-between gap-3";
    header.innerHTML = `<span>${f}층</span><span class="text-slate-400 font-semibold">${list.length}개</span>`;
    card.appendChild(header);

    const mini = document.createElement("div");
    mini.className = "relative rounded-md bg-slate-50 border border-slate-100";
    mini.style.width = w + "px";
    mini.style.height = h + "px";
    list.forEach(b=>{
      const rect = document.createElement("div");
      rect.title = b.name;
      rect.style.position = "absolute";
      rect.style.left = (b.col*MINI_CELL) + "px";
      rect.style.top = (b.row*MINI_CELL) + "px";
      rect.style.width = Math.max(2, b.w*MINI_CELL - 1) + "px";
      rect.style.height = Math.max(2, b.h*MINI_CELL - 1) + "px";
      rect.style.background = CATEGORY_META[b.category].color;
      rect.style.border = "1px solid " + CATEGORY_META[b.category].border;
      rect.style.borderRadius = "2px";
      mini.appendChild(rect);
    });
    card.appendChild(mini);
    card.style.minWidth = Math.max(w + 16, 96) + "px";

    card.onclick = ()=>{
      currentFloor = f;
      selectedId = null;
      renderFloorTabs();
      renderCanvas();
    };
    overviewEl.appendChild(card);
  });
}

let dragCtx = null;
function startDrag(ev, block){
  ev.preventDefault();
  const startX = ev.clientX, startY = ev.clientY;
  const startLeft = block.col*CELL, startTop = block.row*CELL;
  let moved = false;
  const el = canvasEl.querySelector(`[data-id="${block.id}"]`);

  function onMove(e){
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    if(!moved || block.fixed) return;
    el.classList.add("dragging");
    el.style.left = (startLeft + dx) + "px";
    el.style.top = (startTop + dy) + "px";
  }
  function onUp(e){
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    if(moved && !block.fixed){
      const dx = e.clientX - startX, dy = e.clientY - startY;
      let newCol = Math.round((startLeft+dx)/CELL);
      let newRow = Math.round((startTop+dy)/CELL);
      newCol = Math.max(0, newCol);
      newRow = Math.max(0, newRow);
      block.col = newCol; block.row = newRow;
      renderCanvas();
    } else {
      selectedId = block.id;
      renderCanvas();
    }
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

function startResize(ev, block){
  ev.preventDefault(); ev.stopPropagation();
  const startX = ev.clientX, startY = ev.clientY;
  const startW = block.w, startH = block.h;
  const el = canvasEl.querySelector(`[data-id="${block.id}"]`);
  function onMove(e){
    const dx = e.clientX - startX, dy = e.clientY - startY;
    const newW = Math.max(1, startW + Math.round(dx/CELL));
    const newH = Math.max(1, startH + Math.round(dy/CELL));
    el.style.width = (newW*CELL-5)+"px";
    el.style.height = (newH*CELL-5)+"px";
    el._pendingW = newW; el._pendingH = newH;
  }
  function onUp(){
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    if(el._pendingW){ block.w = el._pendingW; block.h = el._pendingH; }
    selectedId = block.id;
    renderCanvas();
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

canvasEl.addEventListener("dragover", ev=> ev.preventDefault());
canvasEl.addEventListener("drop", ev=>{
  ev.preventDefault();
  const raw = ev.dataTransfer.getData("text/plain");
  if(!raw) return;
  const {cat, item} = JSON.parse(raw);
  const rect = canvasEl.getBoundingClientRect();
  const size = item.size || defaultSize(cat, item.name);
  let col = Math.round((ev.clientX - rect.left)/CELL);
  let row = Math.round((ev.clientY - rect.top)/CELL);
  col = Math.max(0, col); row = Math.max(0, row);
  currentBlocks().push({
    id:newId(), name:item.name, num:"", category:cat,
    col, row, w:size.w, h:size.h, fixed:!!item.fixed,
  });
  renderCanvas();
});

canvasWrapEl.addEventListener("mousedown", ev=>{
  if(ev.target === canvasWrapEl || ev.target === canvasEl){
    selectedId = null;
    renderCanvas();
  }
});

document.addEventListener("keydown", ev=>{
  if(ev.key === "Delete" || ev.key === "Backspace"){
    if(selectedId && document.activeElement.tagName !== "INPUT"){
      deleteBlock(selectedId);
    }
  }
});

function deleteBlock(id){
  const list = currentBlocks();
  const idx = list.findIndex(b=>b.id===id);
  if(idx>-1) list.splice(idx,1);
  selectedId = null;
  renderCanvas();
}

/* =========================================================
   7. 우측 - 선택 블록 편집 패널
========================================================= */
function renderEditPanel(){
  const panel = document.getElementById("editPanel");
  const b = currentBlocks().find(x=>x.id===selectedId);
  if(!b){
    panel.innerHTML = `<div class="text-xs text-slate-400 bg-slate-50 rounded-lg px-3 py-3">캔버스에서 블록을 클릭하면<br>이름 변경 · 크기 조절 · 삭제를 할 수 있어요.</div>`;
    return;
  }
  const catOptions = Object.entries(CATEGORY_META).map(([k,m])=>
    `<option value="${k}" ${k===b.category?"selected":""}>${m.label}</option>`).join("");

  panel.innerHTML = `
    <h3 class="text-sm font-extrabold text-slate-700 mb-2">선택된 공간 편집</h3>
    <div class="bg-slate-50 rounded-xl p-3 space-y-2">
      <label class="block text-[11px] font-bold text-slate-500">이름
        <input id="editName" type="text" value="${b.name.replace(/"/g,'&quot;')}" class="mt-1 w-full text-xs border border-slate-200 rounded-lg px-2 py-1.5">
      </label>
      <label class="block text-[11px] font-bold text-slate-500">카테고리
        <select id="editCategory" class="mt-1 w-full text-xs border border-slate-200 rounded-lg px-2 py-1.5">${catOptions}</select>
      </label>
      <div class="flex gap-2">
        <label class="flex-1 text-[11px] font-bold text-slate-500">가로(칸)
          <input id="editW" type="number" min="1" max="12" value="${b.w}" class="mt-1 w-full text-xs border border-slate-200 rounded-lg px-2 py-1.5">
        </label>
        <label class="flex-1 text-[11px] font-bold text-slate-500">세로(칸)
          <input id="editH" type="number" min="1" max="12" value="${b.h}" class="mt-1 w-full text-xs border border-slate-200 rounded-lg px-2 py-1.5">
        </label>
      </div>
      <div class="flex items-center gap-4 pt-1">
        <label class="flex items-center gap-1.5 text-[11px] font-bold text-slate-500">
          <input id="editFixed" type="checkbox" ${b.fixed?"checked":""}> 이동 금지(고정)
        </label>
      </div>
      <button id="editDelete" class="w-full mt-1 text-xs font-bold bg-rose-50 text-rose-500 rounded-lg py-1.5 hover:bg-rose-100">이 블록 삭제</button>
    </div>
  `;

  document.getElementById("editName").oninput = e=>{ b.name = e.target.value; renderCanvas(); };
  document.getElementById("editCategory").onchange = e=>{ b.category = e.target.value; renderCanvas(); };
  document.getElementById("editW").onchange = e=>{ b.w = Math.max(1, parseInt(e.target.value)||1); renderCanvas(); };
  document.getElementById("editH").onchange = e=>{ b.h = Math.max(1, parseInt(e.target.value)||1); renderCanvas(); };
  document.getElementById("editFixed").onchange = e=>{ b.fixed = e.target.checked; renderCanvas(); };
  document.getElementById("editDelete").onclick = ()=> deleteBlock(b.id);
}

/* =========================================================
   8. 우측 - 리스트 / 통계
========================================================= */
function renderList(list){
  const ul = document.getElementById("listBox");
  ul.innerHTML = "";
  let area = 0;
  list.slice().sort((a,b)=> a.row-b.row || a.col-b.col).forEach(b=>{
    area += b.w*b.h*UNIT_AREA;
    const li = document.createElement("li");
    li.className = "flex items-center justify-between gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer" + (b.id===selectedId?" bg-slate-100":"");
    li.innerHTML = `
      <span class="flex items-center gap-1.5 truncate">
        <span class="swatch" style="background:${CATEGORY_META[b.category].color};border-color:${CATEGORY_META[b.category].border}"></span>
        <span class="truncate">${b.name}${b.fixed?" (고정)":""}</span>
      </span>
      <span class="text-slate-400 flex-shrink-0">${b.w*b.h*UNIT_AREA}㎡</span>
    `;
    li.onclick = ()=>{ selectedId = b.id; renderCanvas(); };
    ul.appendChild(li);
  });
  document.getElementById("statCount").textContent = list.length;
  document.getElementById("statArea").textContent = area.toLocaleString();
}

function renderGlobalStat(){
  let totalBlocks = 0, totalArea = 0;
  const perZone = [];
  Object.keys(ZONE_META).forEach(z=>{
    let zc = 0, za = 0;
    ZONE_META[z].floors.forEach(f=>{
      state[z][f].forEach(b=>{ zc++; za += b.w*b.h*UNIT_AREA; });
    });
    totalBlocks += zc; totalArea += za;
    perZone.push(`${ZONE_META[z].name} ${zc}개 · ${za.toLocaleString()}㎡`);
  });
  document.getElementById("globalStat").innerHTML =
    `총 ${totalBlocks}개 공간 · ${totalArea.toLocaleString()}㎡<br><span class="text-slate-400 font-normal">${perZone.join(" · ")}</span>`;
}

/* =========================================================
   9. 상단 유틸리티 - 실제배치 불러오기 / 초기화 / 저장 / 이미지
========================================================= */
document.getElementById("btnLoadReal").onclick = ()=>{
  const data = (ROOM_DATA[currentZone] && ROOM_DATA[currentZone][currentFloor]) || [];
  if(data.length===0){ alert("이 층에 대한 참고 배치 데이터가 없습니다."); return; }
  if(currentBlocks().length>0){
    if(!confirm("현재 층의 배치를 지우고 2026학년도 교사 배치도 기준 참고 배치를 불러올까요?")) return;
  }
  state[currentZone][currentFloor] = autoLayout(data);
  selectedId = null;
  renderCanvas();
};

document.getElementById("btnResetFloor").onclick = ()=>{
  if(!confirm(`${ZONE_META[currentZone].name} ${currentFloor}층 배치를 모두 지울까요?`)) return;
  state[currentZone][currentFloor] = [];
  selectedId = null;
  renderCanvas();
};

document.getElementById("btnResetAll").onclick = ()=>{
  if(!confirm("전체 동/층의 모든 배치를 초기화할까요? 이 작업은 되돌릴 수 없습니다.")) return;
  state = emptyState();
  selectedId = null;
  renderCanvas();
};

document.getElementById("btnSaveJson").onclick = ()=>{
  const payload = { savedAt: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().slice(0,10).replace(/-/g,"");
  a.href = url; a.download = `덕영고_공간배치_${ts}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById("btnLoadJson").onclick = ()=> document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = ev=>{
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const loaded = parsed.state || parsed;
      Object.keys(ZONE_META).forEach(z=>{
        if(!loaded[z]) loaded[z] = {};
        ZONE_META[z].floors.forEach(f=>{ if(!loaded[z][f]) loaded[z][f] = []; });
      });
      state = loaded;
      let maxId = 0;
      Object.values(state).forEach(zone=>Object.values(zone).forEach(list=>list.forEach(b=>{
        const n = parseInt(String(b.id).replace(/\D/g,""))||0;
        if(n>maxId) maxId = n;
      })));
      idSeq = maxId + 1;
      selectedId = null;
      renderCanvas();
      alert("배치 데이터를 불러왔습니다.");
    }catch(err){
      alert("JSON 파일을 읽는 중 오류가 발생했습니다: " + err.message);
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
};

document.getElementById("btnExportImg").onclick = ()=>{
  html2canvas(canvasEl, {backgroundColor:"#fafbfd", scale:2}).then(canvas=>{
    const a = document.createElement("a");
    a.download = `${ZONE_META[currentZone].name}_${currentFloor}층_배치도.png`;
    a.href = canvas.toDataURL("image/png");
    a.click();
  });
};

/* =========================================================
   10. 초기 실행
========================================================= */
function renderAll(){
  renderZoneTabs();
  renderFloorTabs();
  renderPalette();
  renderCanvas();
}

// 최초 접속 시 2026학년도 교사 배치도 데이터를 모든 동·층에 반영해
// '현재 배치도' 상태 그대로 시작하도록 함 (건물 전체 배치도에도 즉시 반영됨)
Object.keys(ROOM_DATA).forEach(z=>{
  Object.keys(ROOM_DATA[z]).forEach(f=>{
    state[z][Number(f)] = autoLayout(ROOM_DATA[z][f]);
  });
});
renderAll();

})();
